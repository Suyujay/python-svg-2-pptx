<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="context-stroke" />
    </marker>
  </defs>

  <!-- slide header -->
  <text x="40" y="50" font-family="Segoe UI, Arial" font-size="22" font-weight="bold" fill="#0F172A">
    SVG to PowerPoint (SVG2Pptx) Information Flow
  </text>
  <text x="40" y="72" font-family="Segoe UI, Arial" font-size="12" fill="#475569">
    Execution pipeline of SVG compilation, coordinate normalization, Intermediate Representation (IR) mapping, and presentation generation.
  </text>

  <!-- Phase Headers -->
  <text x="50" y="115" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#0D9488" letter-spacing="1">FRONTEND &amp; ORCHESTRATION</text>
  <text x="310" y="115" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#4F46E5" letter-spacing="1">COMPILATION &amp; DATA BRIDGE</text>
  <text x="680" y="115" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#2563EB" letter-spacing="1">BACKEND &amp; GENERATION</text>

  <!-- infoBoxes -->

  <!-- SVG Input Source -->
  <g id="box-input" data-element-type="infoBox">
    <rect x="50" y="130" width="220" height="80" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" />
    <svg x="62" y="142" width="20" height="20" viewBox="0 0 24 24" data-element-type="icon" data-icon-name="file">
      <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" fill="#0D9488"/>
    </svg>
    <text x="90" y="154" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#0F172A">
      SVG Input Source
    </text>
    <text x="90" y="158" font-family="Segoe UI, Arial" font-size="10" font-weight="normal" fill="#334155">
      <tspan x="90" dy="14">- Raw XML string or file path</tspan>
      <tspan x="90" dy="14">- Loaded into LXML tree</tspan>
    </text>
  </g>

  <!-- SVG2Pptx Orchestrator -->
  <g id="box-orchestrator" data-element-type="infoBox">
    <rect x="50" y="240" width="220" height="90" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" />
    <svg x="62" y="252" width="20" height="20" viewBox="0 0 24 24" data-element-type="icon" data-icon-name="orchestrator">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="#0D9488"/>
    </svg>
    <text x="90" y="264" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#0F172A">
      SVG2Pptx Orchestrator
    </text>
    <text x="90" y="268" font-family="Segoe UI, Arial" font-size="10" font-weight="normal" fill="#334155">
      <tspan x="90" dy="14">- Instantiates compilation</tspan>
      <tspan x="90" dy="14">- Manages Parser life cycle</tspan>
      <tspan x="90" dy="14">- Writes JSON &amp; PPTX outputs</tspan>
    </text>
  </g>

  <!-- SVGParser -->
  <g id="box-parser" data-element-type="infoBox">
    <rect x="310" y="130" width="290" height="105" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
    <svg x="322" y="142" width="20" height="20" viewBox="0 0 24 24" data-element-type="icon" data-icon-name="code">
      <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z" fill="#4F46E5"/>
    </svg>
    <text x="350" y="154" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#0F172A">
      SVGParser (Frontend)
    </text>
    <text x="350" y="158" font-family="Segoe UI, Arial" font-size="10" font-weight="normal" fill="#334155">
      <tspan x="350" dy="14">- Recursively traverses child nodes</tspan>
      <tspan x="350" dy="14">- Groups inline elements &amp; text boxes</tspan>
      <tspan x="350" dy="14">- Resolves custom "infoBox" nodes</tspan>
      <tspan x="350" dy="14">- Strips SVG namespaces automatically</tspan>
    </text>
  </g>

  <!-- CoordinateNormalizer -->
  <g id="box-normalizer" data-element-type="infoBox">
    <rect x="310" y="260" width="290" height="85" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
    <svg x="322" y="272" width="20" height="20" viewBox="0 0 24 24" data-element-type="icon" data-icon-name="scale">
      <path d="M10.59 9.17L5.41 4H4v1.41l5.17 5.17 1.42-1.41zM4 20h1.41l10.76-10.76-1.41-1.41L4 18.59V20zm16.59-13.41L18.41 4.4a1 1 0 00-1.41 0L15.17 6.23l3.75 3.75 1.83-1.83a.996.996 0 000-1.41z" fill="#4F46E5"/>
    </svg>
    <text x="350" y="284" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#0F172A">
      CoordinateNormalizer
    </text>
    <text x="350" y="288" font-family="Segoe UI, Arial" font-size="10" font-weight="normal" fill="#334155">
      <tspan x="350" dy="14">- Scales SVG viewbox to target slide</tspan>
      <tspan x="350" dy="14">- Converts px coordinates to EMU units</tspan>
      <tspan x="350" dy="14">- Approximates vector font sizes to Pt</tspan>
    </text>
  </g>

  <!-- IR Models (Schema) -->
  <g id="box-ir" data-element-type="infoBox">
    <rect x="310" y="370" width="290" height="95" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
    <svg x="322" y="382" width="20" height="20" viewBox="0 0 24 24" data-element-type="icon" data-icon-name="layers">
      <path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 11.54l-9 7-9-7 1.63-1.27L12 16zm0-11.47L19.36 10 12 15.73 4.64 10 12 4.53z" fill="#4F46E5"/>
    </svg>
    <text x="350" y="394" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#0F172A">
      Intermediate Representation (IR)
    </text>
    <text x="350" y="398" font-family="Segoe UI, Arial" font-size="10" font-weight="normal" fill="#334155">
      <tspan x="350" dy="14">- Typed datastructures (IRRectangle, IRText...)</tspan>
      <tspan x="350" dy="14">- Engine-agnostic abstraction slide tree</tspan>
      <tspan x="350" dy="14">- Serializes to JSON for testing &amp; diagnostics</tspan>
    </text>
  </g>

  <!-- PPTXBackend -->
  <g id="box-backend" data-element-type="infoBox">
    <rect x="680" y="130" width="240" height="150" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
    <svg x="692" y="142" width="20" height="20" viewBox="0 0 24 24" data-element-type="icon" data-icon-name="engine">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="#2563EB"/>
    </svg>
    <text x="720" y="154" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#0F172A">
      PPTXBackend (Engine)
    </text>
    <text x="720" y="158" font-family="Segoe UI, Arial" font-size="10" font-weight="normal" fill="#334155">
      <tspan x="720" dy="14" font-weight="bold" fill="#1E3A8A">Pass 1: Render Layout</tspan>
      <tspan x="720" dy="14">- Draws base shapes &amp; images</tspan>
      <tspan x="720" dy="14">- Builds key registry mapping IDs</tspan>
      <tspan x="720" dy="16" font-weight="bold" fill="#1E3A8A">Pass 2: Render Connectors</tspan>
      <tspan x="720" dy="14">- Links shapes using closest site</tspan>
      <tspan x="720" dy="14">- Implements native PPTX elbows</tspan>
    </text>
  </g>

  <!-- PowerPoint Presentation -->
  <g id="box-output" data-element-type="infoBox">
    <rect x="680" y="320" width="240" height="90" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
    <svg x="692" y="332" width="20" height="20" viewBox="0 0 24 24" data-element-type="icon" data-icon-name="presentation">
      <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z" fill="#2563EB"/>
    </svg>
    <text x="720" y="344" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#0F172A">
      PPTX Output Presentation
    </text>
    <text x="720" y="348" font-family="Segoe UI, Arial" font-size="10" font-weight="normal" fill="#334155">
      <tspan x="720" dy="14">- Native PowerPoint document (.pptx)</tspan>
      <tspan x="720" dy="14">- Selectable vector elements</tspan>
      <tspan x="720" dy="14">- Fully editable shape connections</tspan>
    </text>
  </g>


  <!-- Root-Level Connectors -->

  <!-- SVG Input -> Orchestrator -->
  <line id="conn-1" data-element-type="connector" data-connector-type="straight" x1="160" y1="210" x2="160" y2="240" stroke="#0D9488" stroke-width="2" fill="none" data-start="box-input" data-end="box-orchestrator" marker-end="url(#arrow)" />

  <!-- Orchestrator -> Parser -->
  <polyline id="conn-2" data-element-type="connector" data-connector-type="elbow" points="270,285 290,285 290,182.5 310,182.5" stroke="#4F46E5" stroke-width="2" fill="none" data-start="box-orchestrator" data-end="box-parser" marker-end="url(#arrow)" />

  <!-- Parser -> Normalizer -->
  <line id="conn-3" data-element-type="connector" data-connector-type="straight" x1="455" y1="235" x2="455" y2="260" stroke="#4F46E5" stroke-width="2" fill="none" data-start="box-parser" data-end="box-normalizer" marker-end="url(#arrow)" />

  <!-- Normalizer -> IR -->
  <line id="conn-4" data-element-type="connector" data-connector-type="straight" x1="455" y1="345" x2="455" y2="370" stroke="#4F46E5" stroke-width="2" fill="none" data-start="box-normalizer" data-end="box-ir" marker-end="url(#arrow)" />

  <!-- IR -> Backend -->
  <polyline id="conn-5" data-element-type="connector" data-connector-type="elbow" points="600,417.5 640,417.5 640,205 680,205" stroke="#2563EB" stroke-width="2" fill="none" data-start="box-ir" data-end="box-backend" marker-end="url(#arrow)" />

  <!-- Backend -> Output -->
  <line id="conn-6" data-element-type="connector" data-connector-type="straight" x1="800" y1="280" x2="800" y2="320" stroke="#2563EB" stroke-width="2" fill="none" data-start="box-backend" data-end="box-output" marker-end="url(#arrow)" />

</svg>