<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- InfoBox Component Group -->
  <g id="gcp-suite-infobox" data-element-type="infoBox">
    <!-- Main outer container (must be first/primary rect) -->
    <rect x="240" y="130" width="380" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Top accent bar -->
    <rect x="240" y="130" width="380" height="6" rx="2" fill="#1A73E8"/>

    <!-- Google Cloud Brand Icon -->
    <svg x="275" y="165" width="36" height="36" viewBox="0 0 24 24" data-element-type="icon" data-icon-name="google-cloud">
      <!-- Yellow diamond block -->
      <path d="M12 2L4 6.6v9.2L12 11.2z" fill="#FFB300" />
      <!-- Blue bottom diamond block -->
      <path d="M12 11.2L4 15.8 12 20.4z" fill="#1A73E8" />
      <!-- Green side block -->
      <path d="M12 11.2V20.4l8-4.6z" fill="#0F9D58" />
      <!-- Red top-right block -->
      <path d="M12 2l8 4.6v9.2z" fill="#DB4437" />
    </svg>

    <!-- Header Text Block -->
    <text x="325" y="190" font-family="Segoe UI, Arial" font-size="18" font-weight="bold" fill="#1E293B">
      Google Cloud
    </text>

    <!-- Body text (within text container) -->
    <text x="275" y="215" font-family="Segoe UI, Arial" font-size="11" fill="#475569">
      <tspan x="275" dy="12">Build, modernize, and scale applications using Google's robust,</tspan>
      <tspan x="275" dy="16">highly secure, and performant global cloud infrastructure.</tspan>
    </text>

    <!-- Nested Label 1: Cloud Run -->
    <g id="label-cloudrun">
      <rect x="275" y="280" width="130" height="34" rx="6" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.2"/>
      <text x="340" y="301" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#1A73E8" text-anchor="middle">Cloud Run</text>
    </g>

    <!-- Nested Label 2: BigQuery -->
    <g id="label-bigquery">
      <rect x="420" y="280" width="130" height="34" rx="6" fill="#F3E8FF" stroke="#7E22CE" stroke-width="1.2"/>
      <text x="485" y="301" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#7E22CE" text-anchor="middle">BigQuery</text>
    </g>
  </g>
</svg>