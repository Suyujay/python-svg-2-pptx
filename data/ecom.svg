<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5F6368" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E65100" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7B1FA2" />
    </marker>
  </defs>

  <text x="40" y="38" font-family="Segoe UI, Arial" font-size="18" font-weight="bold" fill="#202124">E-Commerce Microservices Architecture</text>
  <text x="40" y="53" font-family="Segoe UI, Arial" font-size="11" font-weight="normal" fill="#5F6368">Scalable blueprint featuring secure routing, distributed caching, and multi-region resilience</text>

  <g id="group-edge">
    <rect x="40" y="68" width="220" height="395" rx="8" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1" stroke-dasharray="4,4" />
    <text x="50" y="88" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#5F6368" letter-spacing="1">EDGE &amp; ROUTING</text>
  </g>

  <g id="group-core">
    <rect x="290" y="68" width="210" height="395" rx="8" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1" stroke-dasharray="4,4" />
    <text x="300" y="88" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#5F6368" letter-spacing="1">CORE SERVICES</text>
  </g>

  <g id="group-data">
    <rect x="520" y="68" width="210" height="395" rx="8" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1" stroke-dasharray="4,4" />
    <text x="530" y="88" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#5F6368" letter-spacing="1">DATA &amp; CACHING</text>
  </g>

  <g id="group-external">
    <rect x="750" y="68" width="180" height="395" rx="8" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1" stroke-dasharray="4,4" />
    <text x="760" y="88" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#5F6368" letter-spacing="1">EXTERNAL APIS</text>
  </g>

  <g id="client-app" data-element-type="infoBox">
    <rect x="65" y="110" width="170" height="70" rx="6" fill="#EBF3FC" stroke="#4A90E2" stroke-width="1.5"/>
    <g id="ico-client" data-element-type="icon" data-icon-name="client">
      <svg x="75" y="120" width="20" height="20" viewBox="0 0 24 24">
        <path d="M4 6h16v10H4zm16-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 15c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z" fill="#1A73E8"/>
      </svg>
    </g>
    <text x="105" y="133" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1A73E8">Client Portal</text>
    <text x="105" y="149" font-family="Segoe UI, Arial" font-size="9" font-weight="normal" fill="#5F6368">
      <tspan x="105" dy="0">Web &amp; Mobile Clients</tspan>
      <tspan x="105" dy="13">React / iOS / Android</tspan>
    </text>
  </g>

  <g id="api-gateway" data-element-type="infoBox">
    <rect x="65" y="220" width="170" height="115" rx="6" fill="#EBF3FC" stroke="#4A90E2" stroke-width="1.5"/>
    <g id="ico-gateway" data-element-type="icon" data-icon-name="gateway">
      <svg x="75" y="232" width="20" height="20" viewBox="0 0 24 24">
        <path d="M19 13H5v-2h14v2z M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93s3.05-7.44 7-7.93v15.86z" fill="#1A73E8"/>
      </svg>
    </g>
    <text x="105" y="245" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1A73E8">API Gateway</text>
    <text x="75" y="274" font-family="Segoe UI, Arial" font-size="9" font-weight="normal" fill="#5F6368">
      <tspan x="75" dy="0">• Reverse Proxy Routing</tspan>
      <tspan x="75" dy="13">• Rate Limiting (Kong)</tspan>
      <tspan x="75" dy="13">• SSL &amp; CORS Policies</tspan>
    </text>
  </g>

  <g id="auth-service" data-element-type="infoBox">
    <rect x="310" y="110" width="170" height="70" rx="6" fill="#E0F2F1" stroke="#00BFA5" stroke-width="1.5"/>
    <g id="ico-auth" data-element-type="icon" data-icon-name="auth">
      <svg x="320" y="120" width="20" height="20" viewBox="0 0 24 24">
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="#00796B"/>
      </svg>
    </g>
    <text x="350" y="133" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#00796B">Auth Service</text>
    <text x="350" y="149" font-family="Segoe UI, Arial" font-size="9" font-weight="normal" fill="#5F6368">
      <tspan x="350" dy="0">OAuth2 / JWT Tokens</tspan>
      <tspan x="350" dy="13">Identity Provider</tspan>
    </text>
  </g>

  <g id="product-service" data-element-type="infoBox">
    <rect x="310" y="195" width="170" height="70" rx="6" fill="#E0F2F1" stroke="#00BFA5" stroke-width="1.5"/>
    <g id="ico-product" data-element-type="icon" data-icon-name="product">
      <svg x="320" y="205" width="20" height="20" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z" fill="#00796B"/>
      </svg>
    </g>
    <text x="350" y="218" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#00796B">Catalog Service</text>
    <text x="350" y="234" font-family="Segoe UI, Arial" font-size="9" font-weight="normal" fill="#5F6368">
      <tspan x="350" dy="0">Product Catalog Metadata</tspan>
      <tspan x="350" dy="13">Read-Optimized APIs</tspan>
    </text>
  </g>

  <g id="cart-service" data-element-type="infoBox">
    <rect x="310" y="280" width="170" height="70" rx="6" fill="#E0F2F1" stroke="#00BFA5" stroke-width="1.5"/>
    <g id="ico-cart" data-element-type="icon" data-icon-name="cart">
      <svg x="320" y="290" width="20" height="20" viewBox="0 0 24 24">
        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zm-8.9-3h7.45c.75 0 1.41-.41 1.75-1.03l3.85-7.01c.37-.67-.11-1.48-.88-1.48H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H9.1z" fill="#00796B"/>
      </svg>
    </g>
    <text x="350" y="303" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#00796B">Cart Service</text>
    <text x="350" y="319" font-family="Segoe UI, Arial" font-size="9" font-weight="normal" fill="#5F6368">
      <tspan x="350" dy="0">Temporary Cart State</tspan>
      <tspan x="350" dy="13">High-Throughput IO</tspan>
    </text>
  </g>

  <g id="order-service" data-element-type="infoBox">
    <rect x="310" y="365" width="170" height="70" rx="6" fill="#E0F2F1" stroke="#00BFA5" stroke-width="1.5"/>
    <g id="ico-order" data-element-type="icon" data-icon-name="order">
      <svg x="320" y="375" width="20" height="20" viewBox="0 0 24 24">
        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" fill="#00796B"/>
      </svg>
    </g>
    <text x="350" y="388" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#00796B">Order Service</text>
    <text x="350" y="404" font-family="Segoe UI, Arial" font-size="9" font-weight="normal" fill="#5F6368">
      <tspan x="350" dy="0">Checkout Orchestration</tspan>
      <tspan x="350" dy="13">Transactional Integrity</tspan>
    </text>
  </g>

  <g id="redis-cache" data-element-type="infoBox">
    <rect x="540" y="145" width="170" height="85" rx="6" fill="#FFF3E0" stroke="#FF6D00" stroke-width="1.5"/>
    <g id="ico-redis" data-element-type="icon" data-icon-name="redis">
      <svg x="550" y="155" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6D00" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </g>
    <text x="577" y="169" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#E65100">Redis Cache</text>
    <text x="550" y="195" font-family="Segoe UI, Arial" font-size="9" font-weight="normal" fill="#5F6368">
      <tspan x="550" dy="0">• Session Storage</tspan>
      <tspan x="550" dy="13">• Distributed Catalog Cache</tspan>
    </text>
  </g>

  <g id="cockroach-db" data-element-type="infoBox">
    <rect x="540" y="290" width="170" height="110" rx="6" fill="#FFF3E0" stroke="#FF6D00" stroke-width="1.5"/>
    <g id="ico-db" data-element-type="icon" data-icon-name="db">
      <svg x="550" y="300" width="20" height="20" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 4 2 6.5v11C2 20 6.48 22 12 22s10-2 10-4.5v-11C22 4 17.52 2 12 2zm0 18c-4.42 0-8-1.5-8-3V15c1.87 1.5 5 2 8 2s6.13-.5 8-2v2c0 1.5-3.58 3-8 3zm0-4.5c-4.42 0-8-1.5-8-3V11.5c1.87 1.5 5 2 8 2s6.13-.5 8-2v2c0 1.5-3.58 3-8 3zm0-4.5c-4.42 0-8-1.5-8-3V7.5c1.87 1.5 5 2 8 2s6.13-.5 8-2v2c0 1.5-3.58 3-8 3z" fill="#E65100"/>
      </svg>
    </g>
    <text x="577" y="314" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#E65100">CockroachDB</text>
    <text x="550" y="338" font-family="Segoe UI, Arial" font-size="9" font-weight="normal" fill="#5F6368">
      <tspan x="550" dy="0">• Distributed SQL Engine</tspan>
      <tspan x="550" dy="13">• Strong Multi-region ACID</tspan>
      <tspan x="550" dy="13">• Customer &amp; Order Data</tspan>
    </text>
  </g>

  <g id="notification-service" data-element-type="infoBox">
    <rect x="760" y="145" width="160" height="85" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
    <g id="ico-notif" data-element-type="icon" data-icon-name="notif">
      <svg x="770" y="155" width="20" height="20" viewBox="0 0 24 24">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#4A148C"/>
      </svg>
    </g>
    <text x="797" y="169" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#4A148C">Notification Svc</text>
    <text x="770" y="195" font-family="Segoe UI, Arial" font-size="9" font-weight="normal" fill="#5F6368">
      <tspan x="770" dy="0">• Email &amp; SMS Dispatch</tspan>
      <tspan x="770" dy="13">• Event-driven Handlers</tspan>
    </text>
  </g>

  <g id="payment-gateway" data-element-type="infoBox">
    <rect x="760" y="290" width="160" height="85" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
    <g id="ico-payment" data-element-type="icon" data-icon-name="payment">
      <svg x="770" y="300" width="20" height="20" viewBox="0 0 24 24">
        <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2-.9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" fill="#4A148C"/>
      </svg>
    </g>
    <text x="797" y="314" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#4A148C">Payment API</text>
    <text x="770" y="340" font-family="Segoe UI, Arial" font-size="9" font-weight="normal" fill="#5F6368">
      <tspan x="770" dy="0">• Stripe / PayPal Bridge</tspan>
      <tspan x="770" dy="13">• PCI-DSS Compliant Flow</tspan>
    </text>
  </g>

  <line id="conn-1" data-element-type="connector" data-connector-type="straight" x1="150" y1="180" x2="150" y2="220" stroke="#5F6368" stroke-width="1.5" fill="none" data-start="client-app" data-end="api-gateway" marker-end="url(#arrow-grey)" />

  <polyline id="conn-2" data-element-type="connector" data-connector-type="elbow" points="235,260 275,260 275,145 310,145" stroke="#5F6368" stroke-width="1.5" fill="none" data-start="api-gateway" data-end="auth-service" marker-end="url(#arrow-grey)" />

  <polyline id="conn-3" data-element-type="connector" data-connector-type="elbow" points="235,275 285,275 285,230 310,230" stroke="#5F6368" stroke-width="1.5" fill="none" data-start="api-gateway" data-end="product-service" marker-end="url(#arrow-grey)" />

  <polyline id="conn-4" data-element-type="connector" data-connector-type="elbow" points="235,295 285,295 285,315 310,315" stroke="#5F6368" stroke-width="1.5" fill="none" data-start="api-gateway" data-end="cart-service" marker-end="url(#arrow-grey)" />

  <polyline id="conn-5" data-element-type="connector" data-connector-type="elbow" points="235,310 275,310 275,400 310,400" stroke="#5F6368" stroke-width="1.5" fill="none" data-start="api-gateway" data-end="order-service" marker-end="url(#arrow-grey)" />

  <polyline id="conn-6" data-element-type="connector" data-connector-type="elbow" points="480,220 510,220 510,170 540,170" stroke="#E65100" stroke-width="1.2" stroke-dasharray="3,3" fill="none" data-start="product-service" data-end="redis-cache" marker-end="url(#arrow-orange)" />

  <polyline id="conn-7" data-element-type="connector" data-connector-type="elbow" points="480,240 495,240 495,310 540,310" stroke="#E65100" stroke-width="1.5" fill="none" data-start="product-service" data-end="cockroach-db" marker-end="url(#arrow-orange)" />

  <polyline id="conn-8" data-element-type="connector" data-connector-type="elbow" points="480,305 515,305 515,200 540,200" stroke="#E65100" stroke-width="1.2" stroke-dasharray="3,3" fill="none" data-start="cart-service" data-end="redis-cache" marker-end="url(#arrow-orange)" />

  <polyline id="conn-9" data-element-type="connector" data-connector-type="elbow" points="480,325 505,325 505,335 540,335" stroke="#E65100" stroke-width="1.5" fill="none" data-start="cart-service" data-end="cockroach-db" marker-end="url(#arrow-orange)" />

  <polyline id="conn-10" data-element-type="connector" data-connector-type="elbow" points="480,400 515,400 515,365 540,365" stroke="#E65100" stroke-width="1.5" fill="none" data-start="order-service" data-end="cockroach-db" marker-end="url(#arrow-orange)" />

  <polyline id="conn-11" data-element-type="connector" data-connector-type="elbow" points="480,410 745,410 745,332 760,332" stroke="#7B1FA2" stroke-width="1.5" fill="none" data-start="order-service" data-end="payment-gateway" marker-end="url(#arrow-purple)" />

  <polyline id="conn-12" data-element-type="connector" data-connector-type="elbow" points="480,390 735,390 735,187 760,187" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4,4" fill="none" data-start="order-service" data-end="notification-service" marker-end="url(#arrow-purple)" />


  <g id="legend">
    <rect x="40" y="482" width="880" height="38" rx="6" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1" />
     
    <rect x="55" y="495" width="12" height="12" rx="2" fill="#EBF3FC" stroke="#4A90E2" stroke-width="1.5"/>
    <text x="73" y="505" font-family="Segoe UI, Arial" font-size="10" fill="#202124">Client/Edge Route</text>

    <rect x="195" y="495" width="12" height="12" rx="2" fill="#E0F2F1" stroke="#00BFA5" stroke-width="1.5"/>
    <text x="213" y="505" font-family="Segoe UI, Arial" font-size="10" fill="#202124">Core Services</text>

    <rect x="325" y="495" width="12" height="12" rx="2" fill="#FFF3E0" stroke="#FF6D00" stroke-width="1.5"/>
    <text x="343" y="505" font-family="Segoe UI, Arial" font-size="10" fill="#202124">Data/Caching Layer</text>

    <rect x="475" y="495" width="12" height="12" rx="2" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
    <text x="493" y="505" font-family="Segoe UI, Arial" font-size="10" fill="#202124">External Integrations</text>

    <line x1="620" y1="501" x2="640" y2="501" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
    <text x="648" y="505" font-family="Segoe UI, Arial" font-size="10" fill="#202124">Sync (HTTP/gRPC)</text>

    <line x1="770" y1="501" x2="790" y2="501" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-purple)"/>
    <text x="798" y="505" font-family="Segoe UI, Arial" font-size="10" fill="#202124">Async (Event/Cache)</text>
