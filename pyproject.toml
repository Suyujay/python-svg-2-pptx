[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surquest-utils-svg2pptx"
version = "0.0.2"
description = "A high-fidelity, two-pass compiler that translates structured SVG metadata into native PowerPoint (.pptx) presentations."
authors = [
    {name= "surQuest", email= "info@surquest.com"}
]
readme = "README.md"
dependencies = [
    "python-pptx>=1.0.2",
    "lxml"
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0"
]


[project.urls]
"Homepage" = "https://github.com/surquest/python-svg-2-pptx"
"Bug Tracker" = "https://github.com/surquest/python-svg-2-pptx/issues"


[tool.hatch.build.targets.wheel]
packages = ["surquest"]

[tool.hatch.build.targets.sdist.sources]
"src" = ""
