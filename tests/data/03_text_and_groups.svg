<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <text x="50" y="100" font-family="Arial" font-size="24" font-weight="bold" fill="#000000">Heading Text</text>
  <text x="50" y="150" font-family="Calibri" font-size="16" font-style="italic" fill="#555555">Italic Subheading</text>
  
  <text x="50" y="200" font-family="Segoe UI" font-size="14" fill="#111111">
    <tspan x="50" dy="0">This is a multi-line</tspan>
    <tspan x="50" dy="20">text block demonstrating</tspan>
    <tspan x="50" dy="20">element spacing (tspan).</tspan>
  </text>

  <g id="my-group">
    <rect x="300" y="100" width="200" height="150" fill="#f5f5f5" stroke="#cccccc" />
    <circle cx="400" cy="175" r="40" fill="#ffeb3b" />
    <text x="360" y="180" font-weight="bold" fill="#000000">Grouped</text>
  </g>
</svg>